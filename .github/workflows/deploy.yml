name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/pensive-feynman-vjpa4b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # 在 Settings → Secrets and variables → Actions → Variables 設定，沒設定就不啟用
          VITE_CONTACT_PROVIDER: ${{ vars.VITE_CONTACT_PROVIDER }}
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          VITE_LINE_OA_ID: ${{ vars.VITE_LINE_OA_ID }}
          VITE_CHAT_ENDPOINT: ${{ vars.VITE_CHAT_ENDPOINT }}
          VITE_CHAT_WELCOME: ${{ vars.VITE_CHAT_WELCOME }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
